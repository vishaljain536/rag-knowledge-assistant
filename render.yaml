services:
  - type: web
    name: rag-knowledge-assistant-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    numInstances: 1
    envVars:
      # Free instances have an ephemeral filesystem: uploaded files, the SQLite
      # database, and local FAISS/Chroma indexes reset on every restart or spin-down.
      - key: DATABASE_URL
        value: sqlite:////tmp/rag-data/app.db
      - key: DATA_DIR
        value: /tmp/rag-data
      - key: HF_HOME
        value: /tmp/rag-data/huggingface
      - key: ENABLE_URL_INGESTION
        value: "false"
      - key: CORS_ORIGINS
        value: https://rag-knowledge-assistant-wine.vercel.app
      - key: APP_ACCESS_KEY
        generateValue: true
