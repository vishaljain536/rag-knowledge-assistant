services:
  - type: web
    name: rag-knowledge-assistant-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    numInstances: 1
    envVars:
      # Free instances have an ephemeral filesystem: uploaded files, the SQLite
      # database and local FAISS/Chroma indexes may reset on a restart or spin-down.
      - key: DATABASE_URL
        value: sqlite:////tmp/rag-data/app.db
      - key: DATA_DIR
        value: /tmp/rag-data
      - key: HF_HOME
        value: /tmp/rag-data/huggingface
      - key: ENABLE_URL_INGESTION
        value: "false"
      - key: WORKSPACE_TOKENS
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      # Optional: only the admin-demo workspace can select these server-managed keys.
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://rag-knowledge-assistant-wine.vercel.app
